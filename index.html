<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>relapse</title>
<style>
  :root {
    --acc: #3dff8e;
    --acc-dim: #1a5c38;
    --bg: #050807;
  }
  * { box-sizing: border-box; }
  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 30%, rgba(61,255,142,0.07), transparent 70%),
      radial-gradient(ellipse 60% 50% at 50% 100%, rgba(20,80,140,0.10), transparent 70%),
      var(--bg);
    color: var(--acc);
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 2em 1em;
    overflow: hidden;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px);
  }
  #rain { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.75; }
  body > *:not(#rain) { position: relative; z-index: 1; }
  h1 {
    font-size: clamp(2.6em, 9vw, 4.6em); font-weight: 600; letter-spacing: 0.55em;
    margin: 0 0 0.2em; padding-left: 0.55em;
    text-shadow: 0 0 18px rgba(61,255,142,0.55), 0 0 60px rgba(61,255,142,0.25);
    animation: flicker 6s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; } 93% { opacity: 0.6; } 94% { opacity: 1; } 96% { opacity: 0.75; } 97% { opacity: 1; }
  }
  a.btn {
    display: block; position: relative; margin-top: 1.6em; padding: 1em 3.2em;
    border: 1px solid var(--acc); border-radius: 10px;
    color: var(--acc); text-decoration: none; font-size: 1.5em; letter-spacing: 0.3em;
    text-align: center; padding-left: 3.5em;
    background: rgba(61,255,142,0.04);
    box-shadow: 0 0 24px rgba(61,255,142,0.15), inset 0 0 24px rgba(61,255,142,0.05);
    transition: all 0.18s ease;
  }
  a.btn.show { display: block; }
  a.btn:hover, a.btn:active, a.btn:focus-visible {
    background: var(--acc); color: #031007;
    box-shadow: 0 0 44px rgba(61,255,142,0.55), 0 0 90px rgba(61,255,142,0.25);
    transform: translateY(-1px);
    outline: none;
  }
  a.btn:active { transform: translateY(1px); }
  a.alt { display: block; margin-top: 1.2em; color: var(--acc-dim);
    font-size: 0.8em; letter-spacing: 0.15em; text-decoration: none; }
  a.alt:hover { color: var(--acc); }
  a.btn.ctl-focus {
    background: var(--acc); color: #031007;
    box-shadow: 0 0 44px rgba(61,255,142,0.55), 0 0 90px rgba(61,255,142,0.25);
    transform: translateY(-1px); outline: none;
  }
  a.btn.pulse {
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 24px rgba(61,255,142,0.15), inset 0 0 24px rgba(61,255,142,0.05); }
    50% { box-shadow: 0 0 54px rgba(61,255,142,0.6), inset 0 0 30px rgba(61,255,142,0.15); }
  }
  #st {
    margin-top: 2.4em; font-size: 0.85em; letter-spacing: 0.08em;
    color: var(--acc-dim); min-height: 1.2em;
  }
  #st.ok { color: var(--acc); }
  #st.err {
    color: #ff5f56;
    animation: jiggle 0.35s;
  }
  @keyframes jiggle {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
  }
</style>
</head>
<body>
  <h1>RELAPSE</h1>
  <a class="btn" id="jb" href="/relapse/">JAILBREAK</a>
  <a class="btn" id="pl" href="/payloads/">PAYLOADS</a>
  <a class="alt" href="https://soniciso1.github.io/poopicker">sonic's host &rarr;</a>
  <div id="st">…</div>
  <canvas id="rain"></canvas>
<script>
  // Probe elfldr on 127.0.0.1:9021. Fetch to the loopback loader is the
  // same trick the payload menu uses; resolves iff something is listening.
  // Forced over http: an https page would block this fetch as mixed content.
  if (/PlayStation 5\//.test(navigator.userAgent) && location.protocol === 'https:') {
    location.replace('http://' + location.host + location.pathname);
  }

  var st = document.getElementById('st');
  var jb = document.getElementById('jb');
  var pl = document.getElementById('pl');
  var jailbroken = null; // null = probe still pending
  // Non-PS5 devices (phones, PCs): no loader to probe, let both buttons
  // navigate so the pages can be previewed.
  var isPS5 = /PlayStation 5\//.test(navigator.userAgent);
  if (!isPS5) {
    st.textContent = '[preview mode — not a PS5, loader check skipped]';
  }
  if (isPS5) fetch('http://127.0.0.1:9021/', {mode: 'no-cors', cache: 'no-store'})
    .then(function () {
      jailbroken = true;
      st.textContent = '[+] loader on :9021 — console already jailbroken';
      st.className = 'ok';
      pl.classList.add('pulse');
      // celebratory toast, once per browser session
      if (isPS5 && !sessionStorage.getItem('nl_toasted')) {
        sessionStorage.setItem('nl_toasted', '1');
        fetch('http://127.0.0.1:9021/x?uri=' + encodeURIComponent(location.origin + '/payloads/payloads/no_limits.elf'))
          .catch(function () {});
      }
    })
    .catch(function () {
      jailbroken = false;
      st.textContent = '[*] no loader on :9021 — run the jailbreak first';
    });
  jb.addEventListener('click', function (ev) {
    if (isPS5 && jailbroken === true) {
      ev.preventDefault();
      st.textContent = '[+] already jailbroken — pick a payload';
      st.className = 'ok';
      pl.classList.add('pulse');
    }
  });
  pl.addEventListener('click', function (ev) {
    if (isPS5 && jailbroken === false) {
      ev.preventDefault();
      st.textContent = '[*] jailbreak first';
      st.className = '';
      void st.offsetWidth; /* restart the animation on repeat clicks */
      st.className = 'err';
    }
  });

  // ambient matrix rain — landing only. Kept OFF the exploit page: the rAF
  // loop perturbs heap placement the webkit bug depends on.
  (function () {
    const cv = document.getElementById('rain');
    const ctx = cv.getContext('2d');
    const CHARS = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789<>+*";
    const size = 16;
    let cols, drops;
    function resize() {
      cv.width = innerWidth; cv.height = innerHeight;
      cols = Math.ceil(cv.width / size);
      drops = Array.from({length: cols}, () => Math.random() * -cv.height / size);
    }
    resize();
    addEventListener('resize', resize);
    (function frame() {
      ctx.fillStyle = 'rgba(5,8,7,0.09)';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.font = size + 'px monospace';
      for (let i = 0; i < cols; i++) {
        const y = drops[i] * size;
        ctx.fillStyle = Math.random() < 0.05 ? '#7dffb0' : '#1a6e3c';
        ctx.fillText(CHARS[(Math.random() * CHARS.length) | 0], i * size, y);
        drops[i] = y > cv.height && Math.random() > 0.975 ? 0 : drops[i] + 1;
      }
      requestAnimationFrame(frame);
    })();
  })();


  // Controller/keyboard navigation: dpad/arrows highlight (grid-aware),
  // X/Enter selects, Circle/Backspace goes back. PS5 maps the controller to
  // these key events; the Gamepad API poll covers engines that expose it.
  (function () {
    var idx = -1;
    function btns() { return Array.prototype.slice.call(document.querySelectorAll('a.btn')); }
    function show(i) {
      var bs = btns();
      if (!bs.length) return;
      if (i < 0) i = bs.length - 1;
      if (i >= bs.length) i = 0;
      idx = i;
      for (var n = 0; n < bs.length; n++) bs[n].classList.toggle('ctl-focus', n === idx);
      try { bs[idx].scrollIntoView({block: 'nearest'}); } catch (e) { bs[idx].scrollIntoView(false); }
    }
    function gridMove(dir) {
      var bs = btns();
      if (!bs.length) return;
      if (idx < 0) { show(0); return; }
      var r = bs[idx].getBoundingClientRect();
      var best = -1, bestScore = 1e9;
      for (var n = 0; n < bs.length; n++) {
        var q = bs[n].getBoundingClientRect();
        var dy = q.top - r.top;
        if (dir < 0 && dy > -4) continue;
        if (dir > 0 && dy < 4) continue;
        var score = Math.abs(q.left - r.left) + Math.abs(dy) * 0.1;
        if (score < bestScore) { bestScore = score; best = n; }
      }
      if (best >= 0) show(best); else show(idx + dir);
    }
    function activate() { var bs = btns(); if (idx >= 0 && bs[idx]) bs[idx].click(); }
    function back() { if (history.length > 1) history.back(); else location.href = "/"; }
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'ArrowDown') { gridMove(1); ev.preventDefault(); }
      else if (ev.key === 'ArrowUp') { gridMove(-1); ev.preventDefault(); }
      else if (ev.key === 'ArrowRight') { show(idx + 1); ev.preventDefault(); }
      else if (ev.key === 'ArrowLeft') { show(idx - 1); ev.preventDefault(); }
      else if (ev.key === 'Enter' && idx >= 0) { ev.preventDefault(); activate(); }
      else if (ev.key === 'Backspace' || ev.key === 'Escape' || ev.key === 'Esc') { ev.preventDefault(); back(); }
    });
    var last = {};
    setInterval(function () {
      if (!navigator.getGamepads) return;
      var gps = navigator.getGamepads();
      for (var g = 0; g < gps.length; g++) {
        var gp = gps[g]; if (!gp) continue;
        var now = Date.now();
        var pressed = function (i) { return gp.buttons[i] && gp.buttons[i].pressed; };
        function once(name, fn) { if (!last[name] || now - last[name] > 220) { last[name] = now; fn(); } }
        if (pressed(13)) once('d', function () { gridMove(1); });
        if (pressed(12)) once('u', function () { gridMove(-1); });
        if (pressed(15)) once('r', function () { show(idx + 1); });
        if (pressed(14)) once('l', function () { show(idx - 1); });
        if (pressed(0)) once('x', activate);
        if (pressed(1)) once('o', back);
      }
    }, 60);
  })();
</script>
</body>
</html>
